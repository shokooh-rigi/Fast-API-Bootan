[project]
name = "asanbar-pricing-service"
version = "0.1.0"
description = "FastAPI pricing service for Asanbar freight marketplace"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.23",
  "SQLAlchemy>=2.0",
  "asyncpg>=0.28",
  "alembic>=1.12",
  "pydantic>=2.7",
  "redis>=5.4",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "fakeredis>=2.0",
  "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/shokooh-rigi/Fast-API-Bootan"
Repository = "https://github.com/shokooh-rigi/Fast-API-Bootan"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "--strict-markers --cov=app --cov-report=term-missing"
testpaths = ["tests"]
